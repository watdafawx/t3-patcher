name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows: the installer works with junctions, asar files and Windows paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream (type-only vendoring)
        shell: bash
        run: git clone --depth 1 --branch v0.1.10 https://github.com/pingdotgg/t3code .upstream

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The plugins call the `t3p-plugin-build` bin, which only links once its package is built.
      - run: pnpm --filter "@t3p/plugin-build..." build
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm lint
      - run: pnpm run --if-present typecheck
      # Plugin registry (docs/registry.md): schema, https URLs, unique ids, semver, sha256 format.
      - name: Validate registry/index.json
        run: node tools/registry/validate-registry.mjs --strict
      # Download checks need the release assets to exist; they only warn here (network or a not-yet-published release).
      - name: Verify registry downloads (informational)
        continue-on-error: true
        run: node tools/registry/validate-registry.mjs --verify-downloads
