name: Release

# Push a tag like v0.1.0 to build t3p.exe and publish it as a GitHub release. See docs/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Tag matches the installer version
        shell: bash
        run: |
          version=$(node -p "require('./packages/installer/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match packages/installer version ${version}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@t3p/plugin-build..." build
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm lint
      - run: pnpm build:exe

      - name: Verify the checksum file
        shell: bash
        run: |
          cd dist-exe
          sha256sum -c t3p.exe.sha256
          ./t3p.exe --version
          ./t3p.exe selftest

      - name: Write release notes header
        shell: bash
        run: |
          cat > release-header.md <<'NOTES'
          ## Install

          1. Download **t3p.exe** below and save it anywhere (for example your Downloads folder).
          2. Close T3 Code, then double-click `t3p.exe` and choose **Install**.
          3. Start T3 Code. Plugins load with it.

          **Windows SmartScreen may warn "Windows protected your PC".** `t3p.exe` is not code-signed yet, so this is expected: click **More info**, then **Run anyway**. To check the file is the one built here, compare its SHA-256 with `t3p.exe.sha256` (`certutil -hashfile t3p.exe SHA256`).

          Prefer npm? `npx @t3p/installer install`. Details: [README](https://github.com/${{ github.repository }}#installation).

          ## Changes
          NOTES

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-header.md
          generate_release_notes: true
          files: |
            dist-exe/t3p.exe
            dist-exe/t3p.exe.sha256
